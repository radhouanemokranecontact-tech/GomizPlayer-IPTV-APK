name: Android Release — signed APK/AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: amyu/setup-android@v4
        with:
          api-level: 37
          build-tools: 36.0.0

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.GOMIZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gomiz-release.jks"
            echo "GOMIZ_KEYSTORE=$RUNNER_TEMP/gomiz-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets configured — producing unsigned release build"
          fi

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        if: env.KEYSTORE_AVAILABLE == 'true'
        env:
          GOMIZ_KEYSTORE_PASSWORD: ${{ secrets.GOMIZ_KEYSTORE_PASSWORD }}
          GOMIZ_KEY_ALIAS: ${{ secrets.GOMIZ_KEY_ALIAS }}
          GOMIZ_KEY_PASSWORD: ${{ secrets.GOMIZ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build signed release AAB
        if: env.KEYSTORE_AVAILABLE == 'true'
        env:
          GOMIZ_KEYSTORE_PASSWORD: ${{ secrets.GOMIZ_KEYSTORE_PASSWORD }}
          GOMIZ_KEY_ALIAS: ${{ secrets.GOMIZ_KEY_ALIAS }}
          GOMIZ_KEY_PASSWORD: ${{ secrets.GOMIZ_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build unsigned debug APK (fallback)
        if: env.KEYSTORE_AVAILABLE != 'true'
        run: ./gradlew assembleDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gomiz-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
